[package]
name = "obs-websocket-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sans I/O OBS WebSocket v5 protocol core (no_std + alloc)"
readme = "README.md"

[features]
default = ["json"]
## JSON subprotocol (`obswebsocket.json`). Required by the generated typed API.
json = []
## MessagePack subprotocol (`obswebsocket.msgpack`).
## `rmp-serde` enables `serde`'s `std` feature, so this feature is not `no_std`.
msgpack = ["dep:rmp-serde"]

[dependencies]
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
bitflags = { workspace = true }
rmp-serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
