[package]
name = "obs-websocket-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "tokio transport for obs-websocket-io"

[features]
default = []
## `wss://` via rustls and the webpki root store.
rustls = ["dep:rustls", "tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
obs-websocket-core = { workspace = true }
obs-websocket-io = { workspace = true }
futures-util = { workspace = true, features = ["std", "sink"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time", "io-util"] }
tokio-tungstenite = { workspace = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
obs-websocket-mock = { workspace = true }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
