"GetGroupSceneItemList.response.sceneItems" = "Vec<SceneItem>"
"GetSceneItemTransform.response.sceneItemTransform" = "SceneItemTransform"
"SetSceneItemTransform.request.sceneItemTransform" = "SceneItemTransformPartial"
