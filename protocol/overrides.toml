"GetSceneTransitionList.response.transitions" = "Vec<Transition>"
"GetCurrentSceneTransition.response.transitionSettings" = "serde_json::Value"
"SetCurrentSceneTransitionSettings.request.transitionSettings" = "serde_json::Value"
